ffmpeg:
  path: "ffmpeg"   # resolved via FFMPEG_PATH env > config > system PATH (see config.ffmpeg_path())
  encoder: "libx264"
  preset: "fast"
  crf: 23

paths:
  input_dir: "input/"
  output_dir: "output/"
  assets_dir: "assets/"
  temp_dir: "temp/"

ai:
  provider: "groq"
  llm_model: "openai/gpt-oss-120b"
  llm_endpoint: "https://api.groq.com/openai/v1/chat/completions"

defaults:
  min_clip_duration: 45
  aspect_ratio: "9:16"
  music_volume: 0.3
  fade_duration: 0.5

# ── Database ──────────────────────────────────────────────────────────────────
database:
  host: "localhost"
  port: 5432
  name: "viral_clips"
  user: "postgres"          # Default postgres user — override via .env (DB_USER)
  password: ""              # Set via .env as DB_PASSWORD if required

# ── Chunking ──────────────────────────────────────────────────────────────────
chunking:
  silence_threshold_seconds: 1.2
  max_tokens_per_chunk: 1000
  overlap_seconds: 25
  min_chunk_duration_seconds: 15

# ── Embeddings (local SentenceTransformer, no API key) ────────────────────────
# Model path can be overridden from .env via EMBED_MODEL.
# Qwen3-Embedding-0.6B is natively 1024-dim → must match db/schema.sql vector(1024).
# EMBED_DIM truncates longer native vectors (Matryoshka-style head slice).
embeddings:
  provider: "local"
  model: "models/Qwen3-Embedding-0.6B"
  device: "auto"          # auto | cuda | cpu  (auto uses CUDA when available)
  dtype: "auto"           # auto | bfloat16 | float16 | float32 (auto = bf16 on CUDA, fp32 on CPU)
  batch_size: 8
  normalize: true         # L2-normalize for cosine search
  truncate_dim: 1024      # effective vector dim (override via EMBED_DIM)
  max_seq_length: 1024    # token cap per text (override via EMBED_MAX_SEQ)

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: "INFO"                  # DEBUG/INFO/WARNING/ERROR — override via LOG_LEVEL
  file: "logs/viral-clips.log"  # override via LOG_FILE; RotatingFileHandler 5MB x3
  console: true                   # override via LOG_TO_CONSOLE=0 to silence stdout

# ── Similarity Search ─────────────────────────────────────────────────────────
similarity:
  top_k: 3
  threshold: 0.5   # tuned for Qwen3-Embedding-0.6B (was 0.65 for the NVIDIA model)
  llm_confirmation: true
